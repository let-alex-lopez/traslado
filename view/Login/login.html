<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciá sesión en tu cuenta de Buenos Viajes Traslados.">
    <meta name="theme-color" content="#0f4c81">
    <title>Iniciar sesión | Buenos Viajes Traslados</title>
    <link rel="icon" type="image/svg+xml" href="../../images/favicon.svg">
    <link rel="stylesheet" href="../../css/Reset/reset.css">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/Login/login.css">
</head>
<body class="auth">
    <main class="auth-wrap">
        <div class="container auth-card">
            <a class="auth-marca" href="../../index.html" aria-label="Volver al inicio">
                <img src="../../images/buenos viajes traslados.jpg" alt="">
                <span>
                    <strong>Buenos Viajes</strong>
                    <small>Traslados</small>
                </span>
            </a>

            <h1>Iniciar sesión</h1>
            <p class="auth-sub">Ingresá con tu usuario y contraseña para continuar.</p>

            <form class="login-form" id="login-form" novalidate>
                <div class="form-inputs">
                    <label for="nombreUsuario">Usuario</label>
                    <input type="text" id="nombreUsuario" name="nombreUsuario" autocomplete="username" placeholder="Tu usuario">
                </div>
                <div class="form-inputs">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" placeholder="Tu contraseña">
                </div>

                <div class="form-actions">
                    <button class="boton boton-primario" type="submit">Iniciar sesión</button>
                    <a class="boton boton-secundario" href="../../index.html">Cancelar</a>
                </div>
            </form>

            <div id="error-mensaje" class="error" role="alert" aria-live="polite"></div>

            <p class="registrar-link">
                ¿No tenés cuenta? <a href="../Registrar/signup.html">Registrate acá</a>
            </p>
        </div>
    </main>

    <script src="../../js/Login/login.js"></script>
</body>
</html>
